spring.application.name=user_hub

spring.datasource.url=jdbc:mysql://localhost:3306/userhub_schema?useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway now creates/changes tables -> Hibernate only CHECKS they match the entities
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Flyway Configuration
# Scripts live in src/main/resources/db/migration (default location)
spring.flyway.enabled=true
# Our DB already had tables (created by Hibernate earlier) -> mark it as version 0,
# then run V1..V5 on top. Scripts are safe to run on existing data (IF NOT EXISTS / NOT EXISTS).
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0


