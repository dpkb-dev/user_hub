# =====================================================================
# Test profile - loaded ONLY when a test has @ActiveProfiles("test").
# It is MERGED on top of src/main/resources/application.properties:
# only the keys below change, everything else comes from the main file.
# =====================================================================

# Separate database so tests never touch real data (Flyway builds it: V1..V6)
spring.datasource.url=jdbc:mysql://localhost:3306/userhub_test?useSSL=false

# Dummy mail settings - tests must never send real emails
spring.mail.username=test@example.com
spring.mail.password=dummy

# Less console noise during tests
spring.jpa.show-sql=false
